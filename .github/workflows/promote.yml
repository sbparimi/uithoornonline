name: Uithoorn Online — Promote

on:
  workflow_run:
    workflows: ["Uithoorn Online — PR Review"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote reviewed PR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find the reviewed PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          prs=$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" \
            --jq '.[] | select(.base.ref == "main" and .head.repo.full_name == env.GITHUB_REPOSITORY) | .number' | head -n 1)
          if [ -z "$prs" ]; then
            echo "No eligible PR found for reviewed SHA ${HEAD_SHA}."
            exit 1
          fi
          echo "number=$prs" >> "$GITHUB_OUTPUT"

      - name: Verify reviewed SHA is still the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEWED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          actual=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          test "$actual" = "$REVIEWED_SHA" || {
            echo "PR head changed after review; refusing promotion."
            exit 1
          }

      - name: Merge reviewed PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEWED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch
