name: Uithoorn Online — PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Build, lint & launch-safety review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build — feature flags OFF
        env:
          VITE_FF_NOISE_EVIDENCE_V2: "false"
          VITE_FF_LOCAL_SERVICES_V1: "false"
          VITE_FF_FLIGHT_NOISE_HUB_V1: "false"
        run: npm run build

      - name: Production build — feature flags ON
        env:
          VITE_FF_NOISE_EVIDENCE_V2: "true"
          VITE_FF_LOCAL_SERVICES_V1: "true"
          VITE_FF_FLIGHT_NOISE_HUB_V1: "true"
        run: npm run build

      - name: Launch safety and brand review
        shell: bash
        run: |
          set -euo pipefail
          echo "Reviewing user-facing source for prohibited authority claims and borrowed branding..."
          mapfile -t files < <(find src -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.md' \) -print)
          forbidden='(gegarandeerd|gegarandeerde|u heeft recht op|u hebt recht op|u krijgt [€0-9]|claim goedgekeurd|offici[eë]le claim ingediend|offici[eë]le aanvraag ingediend|wij bepalen.*recht|wij bepalen.*compensatie|PostNL|\bDaan\b)'
          if grep -EinH -E "$forbidden" "${files[@]}"; then
            echo "Launch-safety review failed: prohibited authority/entitlement language or borrowed branding found."
            exit 1
          fi
          echo "No prohibited authority/entitlement language or borrowed branding found."

      - name: Dependency audit
        run: npm audit --audit-level=high --package-lock=false

      - name: Review summary
        if: always()
        run: |
          {
            echo "## Uithoorn Online automated review"
            echo "- TypeScript: executed"
            echo "- ESLint: executed"
            echo "- feature-flag OFF build: executed"
            echo "- feature-flag ON build: executed"
            echo "- authority/entitlement and brand scan: executed"
            echo "- dependency audit: executed"
            echo "- Lovable Vite build dependency: removed"
          } >> "$GITHUB_STEP_SUMMARY"
